; PlatformIO Project Configuration File - PocketWebGames
; M5Stack Core2 hosting several local-multiplayer browser games (one at a time).

[env:m5stack-core2]
platform        = espressif32
board           = m5stack-core2
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
; Don't drive RTS/DTR when opening the serial monitor — on the CH9102 that
; otherwise resets the Core2 into download mode instead of running the app.
monitor_rts     = 0
monitor_dtr     = 0

board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DASYNCWEBSERVER_REGEX

lib_deps =
    m5stack/M5Core2 @ ^0.1.9
    bblanchon/ArduinoJson @ ^6.21.5
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
